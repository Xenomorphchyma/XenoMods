[Plugin]
Enabled=true

[HotReload]
; Watch all installed mod resources and react only to changed .scr files.
AutoReloadChangedScr=true
WatchRoot=Mods
PollMilliseconds=800

; F10 reloads all currently active scripts allowed by the filters below.
ManualHotkeyVirtualKey=121

; Safe default: touch mod scripts only. If ScriptNames is not empty, it takes
; precedence over ScriptPrefix. Separate exact ScriptName values with ';'.
ScriptPrefix=Mod_
ScriptNames=

; Experimental. When enabled, all matching active scripts are restarted after
; every newly detected galaxy. It also applies to a new game, so it is off by
; default. Prefer F10 after loading an old test save.
ReloadOnGalaxyLoad=false

