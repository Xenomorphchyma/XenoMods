[Plugin]
; Enabled by default in the exact-behavior Compatible mode.
Enabled=1

[NextDay]
; Compatible: exact original daily behavior through the shared adapter.
; Profile: exact original behavior plus timing logs.
; DominatorCatchUp: shifts verified distant-dominator work but replays every call.
; DominatorFast: reduces work; distant dominator-only systems run once per cadence.
Mode=Compatible
FarAfterInactiveDays=30
FarCadenceDays=4
LogEveryTurns=20
