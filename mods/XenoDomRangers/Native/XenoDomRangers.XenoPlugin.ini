; XenoDomRangers 2.2.0
; Настройки читаются Native Loader только при запуске игры.
; После изменения файла полностью перезапустите Space Rangers HD.
; Значения вне указанных диапазонов безопасно ограничиваются модом.

[Plugin]
Enabled=1

[Recruitment]
; Интервал автоматической проверки набора, ходы. Диапазон: 10..1000.
CheckIntervalTurns=100
; Шанс взять одного нового специалиста при проверке, %. Диапазон: 0..100.
ChancePercent=10
; Максимум одновременных специалистов. 0 отключает автоматический набор. Диапазон: 0..3.
MaximumSpecialists=3
; Минимум свободного места в трюме кандидата. Диапазон: 0..500.
MinimumFreeCargo=20
; Максимально допустимое повреждение корпуса кандидата, %. Диапазон: 0..90.
MaximumHullDamage=40
; Задержка замены погибшего или окончательно потерянного специалиста, ходы. Диапазон: 0..10000.
ReplacementDelayTurns=1000

[Mission]
; Цена заряда относительно GalaxyMoney(Small, race). 100 = стандартная цена. Диапазон: 0..1000.
CamouflageCostPercent=100
; Срок хранения купленного, но не использованного заряда, ходы. Диапазон: 10..3000.
CamouflageLifetimeTurns=300
; Отдых после успешной миссии, ходы. Диапазон: 1..3000.
RestTurns=300
; Максимальное время активного сбора в одной системе, ходы. Диапазон: 1..100.
MaximumSalvageTurns=20
; Сколько последовательных проверок без подходящего лута завершает сбор. Диапазон: 1..20.
EmptyLootChecks=3
; Минимальная стоимость обычного лута относительно GalaxyMoney(Small, race), %.
; 100 = стандартный порог, 0 разрешает подбирать безопасные дешёвые предметы. Диапазон: 0..1000.
MinimumLootCostPercent=100

[Safety]
; Минимальный радиус безопасного лута от центра звезды. Диапазон: 300..2000.
SafeLootStarRadius=400
; До этого радиуса сталкер летит к звезде обычным длинным приказом, затем идёт осторожно. Диапазон: 350..3000.
SolarCarefulRadius=600
; Размер осторожного шага к звезде за ход. Диапазон: 10..500.
SolarApproachStep=100
; Радиус безопасного отхода после зарядки или перегрева. Диапазон: 350..2000.
SolarRetreatRadius=450
; Повреждение корпуса, при котором солнечная попытка прекращается и запускается аварийное укрытие, %. Диапазон: 10..95.
SolarRetreatHullDamage=60
; Число проверок у границы урона без роста топлива до признания зарядки нерабочей. Диапазон: 1..20.
SolarStallChecks=3

; SolarCarefulRadius автоматически поднимается минимум на 100 выше
; SafeLootStarRadius и SolarRetreatRadius, если задано опасное сочетание.
