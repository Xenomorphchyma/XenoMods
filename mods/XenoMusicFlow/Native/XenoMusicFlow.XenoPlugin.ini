; XenoMusicFlow 1.0.0
; Настройки читаются Native Loader только при запуске игры.
; Значения вне указанных диапазонов безопасно ограничиваются модом.

[Plugin]
Enabled=1

[MusicFlow]
; Сколько секунд старый трек продолжает играть после посадки, стыковки
; или взлёта, прежде чем начнётся смена. Диапазон: 0..600.
HoldSeconds=45
; Длительность плавного перехода к музыке нового места, секунды. Диапазон: 1..60.
CrossfadeSeconds=8
; Если старому треку осталось столько секунд или меньше, он доигрывает до
; конца, а следующий трек начинается как обычно. Диапазон: 0..600.
EndGraceSeconds=40
; Категории музыки, которые всегда включаются сразу. Все остальные считаются
; музыкой места (космос, планеты, станции игры и модов), и их смена
; откладывается. '*' в конце означает любое продолжение. Battle: бой в
; космосе, Robot: планетарный бой, Base: главное меню, QuestSoundtrack*:
; музыка квестов. Ролики, музыка скриптов и плейлисты MusicControl
; переключаются сразу в любом случае.
ImmediateCategories=Battle;Robot;ArcadeBattle;Base;Win;Loss;Song;QuestSoundtrack*;Intro;Introduction;Outro;Logo;1C;Begin;Record;Hyper*;MusicOff
